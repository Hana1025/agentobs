global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: pipeline
    static_configs:
      - targets: ["demo-pipeline:9464"]
  - job_name: triage-worker
    static_configs:
      - targets: ["triage-worker:9465"]
  - job_name: server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["server:8080"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
