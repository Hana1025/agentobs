name: agentobs

x-logging: &logging
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  postgres:
    build: ./postgres
    image: agentobs/postgres:17-pgmq
    profiles: [core, dev]
    environment:
      POSTGRES_DB: agentobs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AGENTOBS_SERVER_DB_PASSWORD: ${AGENTOBS_SERVER_DB_PASSWORD}
      AGENTOBS_PIPELINE_DB_PASSWORD: ${AGENTOBS_PIPELINE_DB_PASSWORD}
      AGENTOBS_TRIAGE_DB_PASSWORD: ${AGENTOBS_TRIAGE_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # 本地 dev 调试用；生产部署可删
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentobs"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources: {limits: {memory: 2g}}
    <<: *logging

  server:
    build: ../server
    image: agentobs/server:0.1.0
    profiles: [core]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx512m -XX:+UseSerialGC"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agentobs
      SPRING_DATASOURCE_USERNAME: agentobs_server
      SPRING_DATASOURCE_PASSWORD: ${AGENTOBS_SERVER_DB_PASSWORD}
      AGENTOBS_INGEST_TOKEN: ${AGENTOBS_INGEST_TOKEN}
      AGENTOBS_INTERNAL_TOKEN: ${AGENTOBS_INTERNAL_TOKEN}
      AGENTOBS_RETENTION_DAYS: ${AGENTOBS_RETENTION_DAYS:-90}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    deploy:
      resources: {limits: {memory: 768m}}
    <<: *logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    profiles: [core, dev]
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      AGENTOBS_INGEST_TOKEN: ${AGENTOBS_INGEST_TOKEN}
    volumes:
      - ./otel-collector/${OTEL_COLLECTOR_CONFIG:-config.yaml}:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"   # 本地 dev pipeline 用
    deploy:
      resources: {limits: {memory: 256m}}
    <<: *logging

  triage-worker:
    build:
      context: ../python
      dockerfile: Dockerfile
      target: triage
    image: agentobs/triage-worker:0.1.0
    profiles: [core]
    environment:
      AGENTOBS_SERVER_URL: http://server:8080
      AGENTOBS_INTERNAL_TOKEN: ${AGENTOBS_INTERNAL_TOKEN}
      AGENTOBS_QUEUE_DSN: postgresql://agentobs_triage:${AGENTOBS_TRIAGE_DB_PASSWORD}@postgres:5432/agentobs
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      S1_MODEL: ${S1_MODEL:-}
      S2_MODEL: ${S2_MODEL:-}
      TRIAGE_METRICS_PORT: "9465"
    depends_on:
      postgres: {condition: service_healthy}
      server: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request as u; u.urlopen(\"http://localhost:9465/metrics\")'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources: {limits: {memory: 512m}}
    <<: *logging

  nginx:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: agentobs/web:0.1.0
    profiles: [core]
    ports:
      - "8088:80"
    depends_on:
      server: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz >/dev/null"]
      interval: 15s
      timeout: 3s
      retries: 5
    deploy:
      resources: {limits: {memory: 64m}}
    <<: *logging

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [metrics]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    deploy:
      resources: {limits: {memory: 512m}}
    <<: *logging

  alertmanager:
    image: prom/alertmanager:v0.28.0
    profiles: [metrics]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    deploy:
      resources: {limits: {memory: 128m}}
    <<: *logging

  grafana:
    image: grafana/grafana:11.5.1
    profiles: [metrics]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    deploy:
      resources: {limits: {memory: 256m}}
    <<: *logging

  demo-pipeline:
    build:
      context: ../python
      dockerfile: Dockerfile
      target: demo
    image: agentobs/demo-pipeline:0.1.0
    profiles: [demo]
    environment:
      AGENTOBS_OTLP_ENDPOINT: http://otel-collector:4318
      AGENTOBS_QUEUE_DSN: postgresql://agentobs_pipeline:${AGENTOBS_PIPELINE_DB_PASSWORD}@postgres:5432/agentobs
      AGENTOBS_METRICS_PORT: "9464"
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEMO_RATE: ${DEMO_RATE:-6/min}
      DEMO_SEED: ${DEMO_SEED:-42}
    depends_on:
      postgres: {condition: service_healthy}
      otel-collector: {condition: service_started}
    deploy:
      resources: {limits: {memory: 1g}}
    <<: *logging

volumes:
  pgdata:
  promdata:
