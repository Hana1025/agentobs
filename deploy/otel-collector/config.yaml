receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
  attributes/redact:              # 默认删掉正文；demo 用 config-demo.yaml 不删
    actions:
      - {key: agentobs.content.input, action: delete}
      - {key: agentobs.content.output, action: delete}
  batch:
    timeout: 2s
    send_batch_size: 512
exporters:
  otlphttp/server:
    endpoint: http://server:8080   # 导出器自动拼上 /v1/traces
    compression: none
    headers:
      X-Agentobs-Token: ${env:AGENTOBS_INGEST_TOKEN}
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_interval: 30s
      max_elapsed_time: 300s
service:
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlphttp/server]
