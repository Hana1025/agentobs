# M6：在默认配置基础上多一个导出器，把 trace 同时发到外部 Langfuse（Cloud 或下游自建实例）。
# 用法：docker compose -f compose.yaml -f compose.langfuse.yaml …（make demo-langfuse）
# Langfuse 只支持 OTLP/HTTP；地址形如 https://cloud.langfuse.com/api/public/otel，导出器自动拼 /v1/traces。
extensions:
  basicauth/langfuse:
    client_auth:
      username: ${env:LANGFUSE_PUBLIC_KEY}
      password: ${env:LANGFUSE_SECRET_KEY}
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
  attributes/redact:              # 两条 pipeline 都先删正文，正文不会发往 Langfuse
    actions:
      - {key: agentobs.content.input, action: delete}
      - {key: agentobs.content.output, action: delete}
  attributes/langfuse:            # Langfuse 认 gen_ai.usage.cost 作为成本
    actions:
      - {key: gen_ai.usage.cost, from_attribute: agentobs.cost_usd, action: insert}
  batch:
    timeout: 2s
    send_batch_size: 512
exporters:
  otlphttp/server:
    endpoint: http://server:8080
    compression: none
    headers:
      X-Agentobs-Token: ${env:AGENTOBS_INGEST_TOKEN}
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_interval: 30s
      max_elapsed_time: 300s
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/langfuse
    headers:
      x-langfuse-ingestion-version: "4"   # 不带这个头数据最多延迟 10 分钟才可见
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
service:
  extensions: [basicauth/langfuse]
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlphttp/server]
    traces/langfuse:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, attributes/langfuse, batch]
      exporters: [otlphttp/langfuse]
