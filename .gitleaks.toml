[extend]
useDefault = true

[allowlist]
description = "占位密码与测试 token"
regexes = [
  '''change-me-[a-z-]+''',
  '''(server|pipeline|triage)-test''',
  '''(ingest|internal)-test-token''',
]
paths = [
  '''deploy/\.env\.example''',
  '''python/tests/.*''',          # 脱敏测试用的假 key
  '''.*\.lock''',
  '''web/package-lock\.json''',
  '''docs/.*''',
]
