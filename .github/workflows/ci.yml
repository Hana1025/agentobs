name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.5.26" }
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - name: eval regression gate (rules + mock llm_json)
        run: uv run python -m eval.run --backend rules --backend llm_json --offline --gate

  java:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.12.1" }
      - run: gradle check --no-daemon

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  api-types:
    # 检查提交的 src/api/schema.ts 与 server 生成的 OpenAPI 一致
    runs-on: ubuntu-latest
    needs: [java]
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: agentobs }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.12.1" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: prepare obs schema
        run: psql postgresql://postgres:postgres@localhost:5432/agentobs -c "CREATE SCHEMA IF NOT EXISTS obs"
      - name: start server
        working-directory: server
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/agentobs
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          AGENTOBS_INGEST_TOKEN: ci
          AGENTOBS_INTERNAL_TOKEN: ci
        run: |
          gradle bootJar --no-daemon -x test
          nohup java -jar build/libs/*.jar > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/v3/api-docs > /dev/null && break; sleep 2; done
      - working-directory: web
        run: npm ci && npm run check:api
