name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # 直接用 CLI 全量扫描整个历史；gitleaks-action 在首次推送时用 <root>^..HEAD 做范围会出错
      - name: gitleaks
        env: { GITLEAKS_VERSION: "8.30.1" }
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1

  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.13.8" }
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - name: build postgres+pgmq image (visible errors before tests)
        run: docker build -t agentobs/postgres-test:latest ../deploy/postgres
      - run: uv run pytest -q
      - name: eval regression gate (rules + mock llm_json)
        run: uv run python -m eval.run --backend rules --backend llm_json --offline --gate

  deploy-config:
    # compose 各 profile 组合、Langfuse 覆盖文件、三份 collector 配置都能通过校验
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: deploy } }
    steps:
      - uses: actions/checkout@v4
      - name: compose config
        run: |
          cp .env.example .env
          sed -i 's/^LANGFUSE_PUBLIC_KEY=$/LANGFUSE_PUBLIC_KEY=pk-lf-ci/; s/^LANGFUSE_SECRET_KEY=$/LANGFUSE_SECRET_KEY=sk-lf-ci/' .env
          ALL="--profile core --profile metrics --profile demo --profile rabbitmq --profile dev"
          docker compose -f compose.yaml --env-file .env --profile core config -q
          docker compose -f compose.yaml --env-file .env --profile core --profile metrics --profile demo config -q
          docker compose -f compose.yaml --env-file .env $ALL config -q
          docker compose -f compose.yaml -f compose.langfuse.yaml --env-file .env $ALL config -q
      - name: collector configs
        run: |
          for f in config.yaml config-demo.yaml config-langfuse.yaml; do
            echo "== $f"
            docker run --rm -v "$PWD/otel-collector:/cfg:ro" \
              -e AGENTOBS_INGEST_TOKEN=ci -e LANGFUSE_OTLP_ENDPOINT=https://example.invalid/api/public/otel \
              -e LANGFUSE_PUBLIC_KEY=pk -e LANGFUSE_SECRET_KEY=sk \
              otel/opentelemetry-collector-contrib:0.118.0 validate --config=/cfg/$f
          done

  java:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.12.1" }
      - run: gradle check --no-daemon
      - name: upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: java-test-reports, path: server/build/reports/tests/test, retention-days: 7 }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  api-types:
    # 检查提交的 src/api/schema.ts 与 server 生成的 OpenAPI 一致
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: agentobs }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.12.1" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: prepare obs schema
        run: psql postgresql://postgres:postgres@localhost:5432/agentobs -c "CREATE SCHEMA IF NOT EXISTS obs"
      - name: start server
        working-directory: server
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/agentobs
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          AGENTOBS_INGEST_TOKEN: ci
          AGENTOBS_INTERNAL_TOKEN: ci
        run: |
          gradle bootJar --no-daemon -x test
          nohup java -jar build/libs/*.jar > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/v3/api-docs > /dev/null && break; sleep 2; done
      - name: generate api schema
        working-directory: web
        run: |
          npm ci
          npx openapi-typescript http://localhost:8080/v3/api-docs -o /tmp/schema.ts
      - name: upload generated schema
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: api-schema, path: /tmp/schema.ts, retention-days: 7 }
      - name: compare with committed schema
        working-directory: web
        run: diff -u src/api/schema.ts /tmp/schema.ts
