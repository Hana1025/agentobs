spring:
  application:
    name: agentobs-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agentobs}
    username: ${SPRING_DATASOURCE_USERNAME:agentobs_server}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 8
  flyway:
    schemas: obs
    default-schema: obs
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

agentobs:
  ingest-token: ${AGENTOBS_INGEST_TOKEN:}
  internal-token: ${AGENTOBS_INTERNAL_TOKEN:}
  retention-days: ${AGENTOBS_RETENTION_DAYS:90}
  retention-batch-size: 5000
