[project]
name = "agentobs"
version = "0.1.0"
description = "agentobs: LLM pipeline observability SDK, triage worker, demo and eval"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "opentelemetry-api>=1.29,<2",
    "opentelemetry-sdk>=1.29,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "pyyaml>=6.0",
    "prometheus-client>=0.21",
    "openai>=1.60,<2",
    "psycopg[binary]>=3.2,<4",
    "tiktoken>=0.8",
    "numpy>=2.2",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "respx>=0.22",
    "testcontainers[postgres]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 只有 agentobs 包可发布；triage/demo/eval 随仓库使用
packages = ["agentobs"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["eval/reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: 需要 Docker（Testcontainers）的测试",
]
