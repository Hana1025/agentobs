# CI 回归门槛（占位，评测后再调）。任一后端不达标则 CI 失败。
# rules 后端按设计抓不到 scratch_as_answer / score_outlier（占注入故障的 2/8），所以门槛更低；
# llm_json（CI 里是确定性 mock）要求覆盖全部类型。
normal_false_positive_max: 0.10   # normal 样本（含 transient_rate_limit）被判为非 normal 的比例
fault_recall_min:
  rules: 0.60
  llm_json: 0.90
backends: [rules, llm_json]
dataset:
  size: 300
  seed: 42
  normal_ratio: 0.7
